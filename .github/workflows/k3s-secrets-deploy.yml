name: K3s Secrets Deploy

on:
  workflow_dispatch:

env:
  NAMESPACE: zimfleet

jobs:
  deploy-secrets:
    runs-on: self-hosted
    name: Deploy K3s Secrets
    steps:
      - name: Deployment Configuration
        run: |
          echo "========================================="
          echo "     K3s SECRETS DEPLOYMENT              "
          echo "========================================="
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Secrets: database-secrets"
          echo "========================================="

      - name: Deploy Secrets to Remote K3s Cluster
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          DB_USER: ${{ secrets.DATABASE_USER }}
          DB_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if ! grep -q "$REMOTE_SERVER" ~/.ssh/known_hosts 2>/dev/null; then
            if ! ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>&1; then
              echo "❌ ERROR: Failed to scan host key for $REMOTE_SERVER"
              exit 1
            fi
          fi

          if ! grep -q "$REMOTE_SERVER" ~/.ssh/known_hosts; then
            echo "❌ ERROR: Host key not found in known_hosts"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts
          echo "✓ SSH host verification configured"

          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            NAMESPACE="${{ env.NAMESPACE }}" \
            DB_USER="$DB_USER" \
            DB_PASSWORD="$DB_PASSWORD" \
            SECRET_KEY="$SECRET_KEY" \
          bash << 'ENDSSH'
          set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          if ! kubectl cluster-info > /dev/null 2>&1; then
            echo "❌ Error: k3s is not running or KUBECONFIG is not set correctly"
            exit 1
          fi
          echo "✓ k3s cluster is accessible"

          if ! kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "Creating namespace $NAMESPACE..."
            kubectl create namespace "$NAMESPACE"
            echo "✓ Namespace created"
          else
            echo "✓ Namespace already exists"
          fi

          echo "Creating database-secrets..."
          kubectl create secret generic database-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_USER="$DB_USER" \
            --from-literal=DATABASE_PASSWORD="$DB_PASSWORD" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo ""
          echo "Verifying secrets..."
          kubectl get secrets -n "$NAMESPACE" | grep -E "database-secrets"

          echo ""
          echo "✓ All secrets deployed successfully"
          ENDSSH

      - name: Deployment Summary
        if: always()
        run: |
          echo "========================================="
          echo "  SECRETS DEPLOYMENT SUMMARY"
          echo "========================================="
          echo "✓ database-secrets deployed"
          echo ""
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "========================================="

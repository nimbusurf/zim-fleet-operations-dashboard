apiVersion: v1
kind: Service
metadata:
  name: cmed-postgresql-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: cmed-postgresql
    chart: "cmed-postgresql-1.0.0"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: cmed-postgresql
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: postgres

apiVersion: v1
kind: Service
metadata:
  name: cmed-frontend-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: cmed-frontend
    chart: "cmed-frontend-1.0.0"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: cmed-frontend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
